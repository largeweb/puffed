<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#999;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Cigar body -->
  <rect x="80" y="280" width="320" height="50" rx="8" fill="#8B4513"/>
  <rect x="80" y="285" width="320" height="20" fill="#A0522D"/>
  
  <!-- Cigar band -->
  <rect x="180" y="275" width="60" height="60" rx="4" fill="#d97706"/>
  <rect x="185" y="280" width="50" height="50" rx="2" fill="#f59e0b"/>
  <text x="210" y="315" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">P</text>
  
  <!-- Ash tip -->
  <rect x="380" y="280" width="40" height="50" rx="4" fill="#888"/>
  <rect x="400" y="283" width="20" height="44" fill="#666"/>
  
  <!-- Smoke wisps -->
  <path d="M420 270 Q430 240 420 210 Q410 180 420 150 Q430 120 415 90" stroke="url(#smoke)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M440 275 Q455 245 445 215 Q435 185 450 155 Q465 125 450 95" stroke="url(#smoke)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M400 265 Q390 235 400 205 Q410 175 395 145" stroke="url(#smoke)" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Glow ember -->
  <ellipse cx="410" cy="305" rx="15" ry="10" fill="#ff6b35"/>
  <ellipse cx="410" cy="305" rx="8" ry="5" fill="#ff9500"/>
</svg>
